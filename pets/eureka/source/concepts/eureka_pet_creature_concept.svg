    <ellipse cx="356" cy="260" rx="38" ry="43" fill="#f8fbff" stroke="#f8fbff" stroke-width="16"/>
    <ellipse cx="177" cy="219" rx="38" ry="43" fill="#f8fbff" stroke="#15171d" stroke-width="13"/>
    <ellipse cx="356" cy="260" rx="38" ry="43" fill="#f8fbff" stroke="#15171d" stroke-width="13"/>
    <circle cx="188" cy="230" r="14" fill="#15171d"/>
    <circle cx="345" cy="271" r="14" fill="#15171d"/>
    <circle cx="195" cy="221" r="5.5" fill="#f8fbff"/>
    <circle cx="352" cy="262" r="5.5" fill="#f8fbff"/>

